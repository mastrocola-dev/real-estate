[project]
name = 'real-estate'
version = '0.1.0'
requires-python = '>=3.11'
dependencies = [
  'httpx>=0.28',
  'selectolax>=1.0',
  'psycopg[binary]>=3.2',
]

[project.optional-dependencies]
dev = ['pytest>=8', 'ruff>=0.8']
analysis = ['pandas>=2.2', 'scikit-learn>=1.5']
web = ['fastapi>=0.115', 'uvicorn>=0.32', 'real-estate[analysis]']

[project.scripts]
estate = 'real_estate.cli:main'

[build-system]
requires = ['setuptools>=69']
build-backend = 'setuptools.build_meta'

[tool.setuptools.packages.find]
where = ['src']

[tool.setuptools.package-data]
'real_estate.web' = ['static/*']

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = 'single'

[tool.ruff.lint]
select = ['E', 'F', 'I', 'UP', 'B']
